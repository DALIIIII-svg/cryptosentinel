# CryptoSentinel local stack. Start with:  make up   (or: docker compose -f infra/local/docker-compose.yml up -d)
#
#   Kafka            localhost:9092   (inside Docker: kafka:29092)
#   Kafbat UI        http://localhost:8080
#   SeaweedFS S3     http://localhost:8333
#   DynamoDB Local   http://localhost:8000
name: cryptosentinel

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: cs-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = for your laptop (localhost:9092); INTERNAL = for other containers (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"   # any base64 UUID; fixed so the volume can be reused
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come from common/topics.py
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: cs-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cryptosentinel-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: cs-seaweedfs
    # All-in-one: master + volume + filer + S3 gateway. No S3 config file = no auth (local only).
    command: >
      server -dir=/data -s3 -s3.port=8333
      -master.volumeSizeLimitMB=256 -volume.max=100
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer web UI (browse files)
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/status || wget -q -O /dev/null http://localhost:8333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: cs-dynamodb
    # -sharedDb: one database whatever the credentials/region; -dbPath: keep data on a volume
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: root   # the image's default user cannot write to a fresh named volume
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Phase 2 collectors. Started only with the "collect" profile:  make collect
  # They read .env.local, then point at the other containers by name.
  # restart: unless-stopped -> they come back after a crash or a Docker restart.
  # ---------------------------------------------------------------------------
  price-producer:
    <<: &app
      build:
        context: ../..
        dockerfile: infra/local/Dockerfile.app
      image: cryptosentinel-app:latest
      env_file: ../../.env.local
      environment:
        KAFKA_BOOTSTRAP: kafka:29092
        S3_ENDPOINT_URL: http://seaweedfs:8333
        DYNAMO_ENDPOINT_URL: http://dynamodb-local:8000
      depends_on:
        kafka:
          condition: service_healthy
      restart: unless-stopped
      profiles: ["collect"]
      logging:
        driver: json-file
        options: {max-size: "10m", max-file: "3"}
    container_name: cs-price-producer
    command: ["python", "-m", "producers.price_producer"]

  news-producer:
    <<: *app
    container_name: cs-news-producer
    command: ["python", "-m", "producers.news_producer"]

  s3-sink:
    <<: *app
    container_name: cs-s3-sink
    command: ["python", "-m", "processing.s3_sink"]

  hot-writer:
    <<: *app
    container_name: cs-hot-writer
    command: ["python", "-m", "processing.hot_writer"]

volumes:
  kafka-data:
  seaweed-data:
  dynamodb-data:
